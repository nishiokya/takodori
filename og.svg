<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OG画像のソース。og.png は次で再生成する:
       rsvg-convert -w 1200 -h 630 og.svg -o og.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f9fb"/>
      <stop offset="1" stop-color="#e6edf5"/>
    </linearGradient>
    <g id="tako">
      <path d="M38 47 C24 49 15 56 15 63 Q20.5 76 26.5 66 Q32 79 38 64 Q44 75 50 67 Q56 78 62 64 Q68 76 73.5 66 Q79.5 78 85 63 C85 56 76 49 62 47 C58 51 42 51 38 47 Z" fill="#1f9a4f" stroke="#146e38" stroke-width="2.1" stroke-linejoin="round"/>
      <ellipse cx="50" cy="32" rx="27" ry="25" fill="#1f9a4f" stroke="#146e38" stroke-width="1.6"/>
      <path d="M25 18 Q25 9 50 8 Q75 9 75 18" fill="none" stroke="#58c47e" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>
      <ellipse cx="33" cy="45" rx="4.2" ry="2.6" fill="#ff9a86" opacity=".6"/>
      <ellipse cx="67" cy="45" rx="4.2" ry="2.6" fill="#ff9a86" opacity=".6"/>
      <ellipse cx="38" cy="31" rx="7.2" ry="8.8" fill="#fff"/><circle cx="39" cy="33" r="3.7" fill="#142a18"/>
      <ellipse cx="62" cy="31" rx="7.2" ry="8.8" fill="#fff"/><circle cx="61" cy="33" r="3.7" fill="#142a18"/>
      <path d="M42 48 Q50 54 58 48" fill="none" stroke="#c0392b" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 盤面を思わせる牌タイル -->
  <g opacity=".5">
    <rect x="72" y="96" width="86" height="106" rx="14" fill="#fdf7ea" stroke="#d8cfbb" stroke-width="3"/>
    <rect x="1042" y="428" width="86" height="106" rx="14" fill="#fdf7ea" stroke="#d8cfbb" stroke-width="3"/>
  </g>

  <!-- タコ本体 -->
  <g transform="translate(110 168) scale(3.05)">
    <use href="#tako"/>
  </g>

  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif" fill="#1f2937">
    <text x="466" y="262" font-size="96" font-weight="800" letter-spacing="6">二タコ採り</text>
    <text x="470" y="330" font-size="34" font-weight="600" fill="#0e7490">二角どり・タコどりの四川省風パズル</text>
    <text x="470" y="394" font-size="30" font-weight="500" fill="#4b5563">無料・広告なし・登録不要／スマホもPCも</text>
  </g>

  <g font-family="Hiragino Sans, Helvetica Neue, sans-serif">
    <rect x="470" y="432" width="300" height="54" rx="27" fill="#0e7490"/>
    <text x="620" y="468" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">takodori.tanishi.de</text>
  </g>
</svg>
